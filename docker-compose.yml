services:
  zookeeper:
    image: zookeeper:3.9
    container_name: ddbms-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1

  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27021"]
    ports:
      - "27021:27021"
      - "27022:27022"
      - "27023:27023"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    network_mode: "service:mongo1"
    depends_on:
      - mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27022"]
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    network_mode: "service:mongo1"
    depends_on:
      - mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27023"]
    volumes:
      - mongo3_data:/data/db

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: